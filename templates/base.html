<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Ze Auto Scanner 9000{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  </head>
  <body>
    <nav class="topbar">
      <a class="brand" href="{{ url_for('dashboard.index') }}">Ze Auto Scanner 9000</a>
      <div class="nav-links">
        <a href="{{ url_for('dashboard.index') }}">Dashboard</a>
        <a href="{{ url_for('student.list_students') }}">Students</a>
        <a href="{{ url_for('assessment.list_assessments') }}">Assessments</a>
        <a href="{{ url_for('scanning.upload_page') }}">Scan sheets</a>
        <a href="{{ url_for('analytics.index') }}">Analytics</a>
      </div>
    </nav>
    <main class="page">
      {% with messages = get_flashed_messages(with_categories=true) %}
        {% for category, message in messages %}
          <div class="alert alert-{{ 'danger' if category == 'error' else category }}" role="alert">{{ message }}</div>
        {% endfor %}
      {% endwith %}
      {% block content %}{% endblock %}
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
  </body>
</html>
