<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Auto Grader{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  </head>
  <body>
    <nav class="topbar">
      <div class="brand">Auto Grader</div>
      <div class="nav-links">
        <a href="{{ url_for('dashboard.index') }}">Dashboard</a>
        <a href="{{ url_for('student.list_students') }}">Students</a>
        <a href="{{ url_for('assessment.list_assessments') }}">Assessments</a>
        <a href="{{ url_for('analytics.index') }}">Analytics</a>
      </div>
    </nav>
    <main class="page">
      {% block content %}{% endblock %}
    </main>
    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
  </body>
</html>
